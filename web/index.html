<!doctype html>
<html><head><meta charset="utf-8"><title>qa-fullstack staticgo</title></head>
<body>
<main style="font-family:sans-serif;padding:2rem">
  <h1>qa-fullstack staticgo</h1>
  <p id="api-base"></p>
  <p>backend says: <b id="msg">loading…</b></p>
  <p id="err" style="color:crimson"></p>
</main>
<script src="/config.js"></script>
<script>
// (a) bindings form: the API base is READ from the environment (injected as a
// global by the platform/build), never hardcoded. Uninjected -> same-origin.
(function () {
  var API_BASE = (window.API_BASE || '').replace(/\/$/, '');
  document.getElementById('api-base').textContent = 'API_BASE=' + JSON.stringify(API_BASE);
  fetch(API_BASE + '/api/hello')
    .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
    .then(function (d) { document.getElementById('msg').textContent = d.message || JSON.stringify(d); })
    .catch(function (e) {
      document.getElementById('msg').textContent = 'backend unreachable';
      document.getElementById('err').textContent = 'error: ' + e;
    });
})();
</script>
<footer>Version 1.0.0</footer>
</body></html>
